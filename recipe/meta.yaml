{% set version = "1.2.2" %}
{% set name = "anaconda-opentelemetry" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/anaconda/anaconda-otel-python/archive/refs/tags/v{{ version }}.tar.gz
  sha256: a04d4feafe20eeaebb8086dd10524de50bd2025854e8b2a9dfa44aeafac8e8c1

build:
  number: 0
  skip: True  # [py<310]
  script: pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=61.0
    - wheel
  run:
    - python
    # To point to conda-recipe/meta.yaml
    # https://github.com/anaconda/anaconda-otel-python/blob/v1.2.2/conda-recipe/meta.yaml#L23
    # pyproject.toml does not specify all dependency.
    - anaconda-anon-usage
    - pyyaml >=6.0.2
    - opentelemetry-api ==1.40.0
    - opentelemetry-exporter-otlp-proto-common ==1.40.0
    - opentelemetry-exporter-otlp-proto-grpc ==1.40.0
    - opentelemetry-exporter-otlp-proto-http ==1.40.0
    - opentelemetry-proto ==1.40.0
    - opentelemetry-sdk ==1.40.0
    - opentelemetry-semantic-conventions ==0.61b0
    - grpcio >=1.71.0

test:
  imports:
    - anaconda_opentelemetry
  source_files:
    - tests/
  requires:
    - pip
    - pytest
    - flask
    - conda
  commands:
    - pip check
    # AnacondaLogger not initialized in this context, resulting in failed tests.
    - python -m pytest ./tests -k "not (test_metrics or test_logs)"

about:
  home: https://github.com/anaconda/anaconda-otel-python
  summary: "An OpenTelemetry wrapper for Anaconda application telemetry"
  description: |
    Anaconda's OpenTelemetry Instrumentation Libraries
  license: Apache-2.0
  license_family: APACHE
  license_file: LICENSE
  dev_url: https://github.com/anaconda/anaconda-otel-python
  doc_url: https://github.com/anaconda/anaconda-otel-python
